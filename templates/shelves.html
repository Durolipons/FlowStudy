{% extends 'base.html' %}
{% block title %}Shelves — Bibliotheca{% endblock %}
{% block content %}
<h1>Shelves</h1>
<p class="sub">The folder tree of the library, mirrored as shelves.
{{ total_files }} active files.</p>
<div class="grid g3">
  {% for c in tops %}
  <a class="panel" style="display:block" href="{{ url_for('shelf', coll_id=c.id) }}">
    <strong>{{ c.name }}</strong>
    <div class="muted">{{ c.book_count }} book files below</div>
  </a>
  {% endfor %}
</div>
{% endblock %}
